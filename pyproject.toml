[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cp-adaptok"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy", "PyYAML", "Pillow", "scipy", "opencv-python-headless"]
[project.optional-dependencies]
eval = ["lpips", "pytorch-msssim", "DISTS-pytorch", "matplotlib"]
dev = ["pytest", "pytest-cov", "radon", "ruff"]
[tool.setuptools.packages.find]
include = ["cp_adaptok*", "aip_vtok*"]
[tool.pytest.ini_options]
testpaths = ["cp_adaptok/tests", "tests/aip_vtok"]
markers = ["integration: actual upstream networks", "gpu: CUDA required", "slow: native resolution"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
