name: Checks

on: [push, pull_request]

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg zlib1g-dev
      - name: Install CPU and development dependencies
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' pybind11==3.1.0
      - name: Build CPU entropy extensions
        run: |
          (cd third_party/DCVC/src/cpp && python setup.py build_ext \
            --build-lib "$GITHUB_WORKSPACE/.build/pht-tok/pht/site" \
            --build-temp "$GITHUB_WORKSPACE/.build/dcvc-rans")
          bash benchmarks/pht_tok/native/build_entropy.sh
          bash baselines/hla_tok_uf_v2/build_records.sh
          bash baselines/hla_tok_uf_v2/build_legacy_rans.sh
      - name: Check the retained implementations
        env:
          PYTHONPATH: .build/uf_v2/records:.build/uf_v2/legacy:.build/pht-tok/pht/site:.
          OMP_NUM_THREADS: "4"
        run: |
          python -m pytest -q -rs -m 'not gpu'
          ruff check .
          mypy
