extends: ../base.yaml
purpose: train
stage: 2
seed: 20261116
gpu_memory_fraction: 0.8
model:
  token_aggregation: global_softmax_v1
paths:
  checkpoint: null
  output: results/large_scale
  save_checkpoint: checkpoints/large_scale/latest.pt
data: {train: [], validation: [], test: []}
training:
  crop: 512
  sequence_length: 4
  sequence_schedule: []
  resolution_schedule: []
  tbptt: 2
  batch_sequences: 1
  gradient_accumulation: 2
  amp_bf16: true
  clip_grad_norm: 1.0
  optimizer: AdamW
  lr: 0.0001
  scheduler: {warmup_steps: 200, total_steps: 8000, min_lr_ratio: 0.1}
  save_every: 500
  validate_every: 1000
  full_validate_every: 2000
  milestones: [2000, 4000, 8000, 12000]
  diagnostic_steps: [0]
  diagnostic_every: 500
  cpu_prefetch: true
  frame_cache_bytes: 268435456
  horizontal_flip: true
  query_initialization_scale: 1.0
  grid_query_initialization_scale: 1.0
  budgets: [128, 256, 512, 1024, 2048]
  vq:
    strategy: stochastic_training
    temperature: 0.01
    final_temperature: 0.01
    anneal_steps: 1
    warmup_steps: 0
    initialization: null
teacher: {policy: none}
prefix_training:
  mode: legacy
  budgets: [128, 256, 512, 1024, 2048]
  margin: 0.0
  weights: {128: 1.0, 256: 1.0, 512: 1.0, 1024: 1.0, 2048: 1.0}
loss:
  mse: 1.0
  latent: 0.0
  vq: 0.1
  lpips: 0.01
  dists: 0.0
  monotonic: 0.1
  estimated_rate: 0.0
evaluation:
  budgets: [128, 256, 512, 1024, 2048]
  metrics: [psnr, ms-ssim, lpips, dists]
  save_frames: false
  intra_period: 32
large_scale:
  manifest_dir: data/manifests
  output_root: results/large_scale
  checkpoint_root: checkpoints/large_scale
  minimum_train_videos: 100
  minimum_train_frames: 10000
  minimum_native1080_videos: 8
  gpu_reserve_mib: 8192
  gpu_min_free_mib: 40000
  selection_rule: mean_budget_mse_plus_endpoints_and_regression_v1
  early_stopping: false
  phases:
    s1: {updates: 8000, crop: 512, sequence_length: 4, tbptt: 2, gradient_accumulation: 2, lr: 0.0001, lpips: 0.01}
    s2: {updates: 12000, crop: [720, 1280], sequence_length: 4, tbptt: 2, gradient_accumulation: 2, lr: 0.00005, lpips: 0.03}
    s3: {updates: 8000, crop: [1080, 1920], sequence_length: 4, tbptt: 2, gradient_accumulation: 4, lr: 0.00002, lpips: 0.03}
    s4:
      updates: 4000
      crop: [1080, 1920]
      sequence_length: 8
      sequence_schedule: [{step: 0, frames: 8}, {step: 2000, frames: 16}]
      tbptt: 2
      gradient_accumulation: 4
      lr: 0.00001
      lpips: 0.03
      # No unvalidated rate surrogate: optional RD fine tuning requires a separate train-only calibration.
      estimated_rate: 0.0
  entropy_calibration: {clips: 16, frames: 4, crop: 512, pseudocount: 1.0}
  auxiliary_updates: 1000
