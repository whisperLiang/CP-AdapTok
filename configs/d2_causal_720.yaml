extends: d1_vq_512.yaml
stage: 2
training:
  crop: [720, 1280]
  query_initialization_scale: 1.0
  sequence_length: 4
  tbptt: 2
  lr: 0.0001
  resolution_schedule:
    - {step: 0, crop: [540, 960]}
    - {step: 50, crop: [720, 1280]}
  vq:
    strategy: stochastic_training
    temperature: 0.01
    final_temperature: 0.002
    anneal_steps: 200
    warmup_steps: 0
    initialization: null
teacher:
  policy: i_only
  decay_steps: 100
  minimum_factor: 0.0
paths:
  checkpoint: checkpoints/optimization_20261115/d1/latest.pt
  save_checkpoint: checkpoints/optimization_20261115/d2/latest.pt
  output: results/optimization_20261115/d2
