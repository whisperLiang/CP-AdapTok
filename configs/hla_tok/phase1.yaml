seed: 1
optimizer: AdamW
learning_rate: 0.0002
weight_decay: 0.01
gradient_clip_norm: 1.0
warmup_steps: 200
precision: bf16
native_budget: 16320
save_every: 500
codebook_calibration_frames: 40
continuous:
  - {height: 256, width: 256, steps: 500}
fixed:
  - {height: 256, width: 256, steps: 1500}
  - {height: 512, width: 512, steps: 2000}
  - {height: 1080, width: 1920, steps: 1000}
loss:
  rgb_l1: 1.0
  rgb_mse: 0.1
  lpips_vgg: 1.0
  dists: 0.2
  vq_codebook: 1.0
  vq_commitment: 0.25
