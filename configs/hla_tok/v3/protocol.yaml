native_budget: 16320
optimizer: AdamW
precision: bf16
physical_batch: 1
effective_batch: 1
learning_rate: 0.0002
native_learning_rate: 0.00005
weight_decay: 0.01
gradient_clip_norm: 1.0
warmup_updates: 200
minimum_lr_ratio: 0.1
checkpoint_every: 500
full_validation_updates: [4000, 8000]
loss:
  rgb_l1: 1.0
  rgb_mse: 0.5
  lpips_alex: 0.5
  lpips_vgg: 0.5
  dists: 0.2
  vq_codebook: 1.0
  vq_commitment: 0.25
gradient_calibration:
  samples: 32
  ratio_interval: [0.5, 2.0]
  multiplier_interval: [0.25, 4.0]
  seed_offset: 300000
latent:
  weight: 0.1
  decay_start: 2000
  decay_end: 12000
calibration_frames: 40
progressive:
  proportions: [10, 10, 15, 15, 25, 10, 10, 5]
  fixed_weight: 0.5
  monotonic_weight: 0.0
  tolerance: {global_psnr: 0.05, lpips: 0.002, dists: 0.002}
  gains: {base_to_fixed_psnr: 2.0, base_to_fixed_lpips: 0.03, mid_to_fixed_psnr: 0.5}
dense:
  - {updates: 8000, resolution: crop}
  - {updates: 4000, resolution: native}
continuous:
  - {updates: 2000, resolution: crop, freeze_spatial: true}
  - {updates: 10000, resolution: crop}
  - {updates: 8000, resolution: native}
quantized:
  - {updates: 4000, resolution: crop}
  - {updates: 6000, resolution: native}
progressive_schedule:
  - {updates: 8000, resolution: crop}
  - {updates: 12000, resolution: native}
dense_thresholds: {global_psnr: 26.0, lpips: 0.18, dists: 0.08}
fixed_thresholds: {global_psnr: 24.92307, lpips: 0.20373, dists: 0.09173}
fixed_reference_bpp: 0.102315
material_degradation: {global_psnr: 0.1, lpips: 0.005, dists: 0.005}
meaningful_gain: {global_psnr: 0.3, lpips: 0.02}
extension:
  max_updates: 4000
  near: {global_psnr: 0.5, lpips: 0.03, dists: 0.02}
performance:
  frames: 64
  repeats: 3
  pipeline_fps: 30
  neural_fps_goal: 60
