model:
  height: 1080
  width: 1920
  channels: [48, 64, 96, 128, 192, 192, 192]
  decoder_channels: [192, 128, 96, 64, 32, 24]
  heads: 6
  window: 4
  attention_blocks: 1
  temporal: true
  codebook_size: 8192
  embedding_dim: 16
  budgets: [256, 512, 1024, 2048]
  gop: 32
  gradient_checkpointing: true
training:
  seed: 20261117
  learning_rate: 0.0001
  weight_decay: 0.01
  amp_bf16: true
  batch_sequences: 1
  gradient_clip: 1.0
  tbptt: 2
  sequence_schedule: [[0, 4], [1000, 16], [5000, 32]]
  milestones: [300, 1000, 5000]
  checkpoint_every: 100
  validation_every: 100
  nested_every: 4
  budget_mode: nested
  fixed_budget: 2048
  losses:
    l1: 1.0
    mse: 1.0
    perceptual: 0.1
    vq: 1.0
    temporal: 0.05
    monotonic: 0.1
data:
  index: data/adaptok_hr/index.json
  cp_manifest_directory: data/manifests
  external_sources: []
evaluation:
  frames: 64
  amp_bf16: true
  validation_ids: ["DAVIS2017:blackswan", "DAVIS2017:car-roundabout", "DAVIS2017:dog"]
  historical_ids: ["DAVIS2017:cows", "DAVIS2017:goat", "DAVIS2017:parkour"]
benchmark:
  warmup: 5
  repeats: 20
  batch_size: 1
